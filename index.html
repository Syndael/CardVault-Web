<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CardVault</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #061014;
            --surface: #0b1c22;
            --surface-soft: #0f2830;
            --surface-strong: #12343c;
            --border: #1e5260;
            --text: #d7fbff;
            --muted: #7ab7c4;
            --cyan: #42e8ff;
            --cyan-strong: #00c7e6;
        }
        * { box-sizing: border-box; margin: 0; }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 32px;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, sans-serif;
            padding: 24px;
        }
        h1 {
            color: var(--cyan);
            font-size: 40px;
            font-weight: 760;
        }
        .apps {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 260px;
            padding: 32px 24px;
            border: 1px solid var(--border);
            background: linear-gradient(180deg, var(--surface-soft), var(--surface));
            text-decoration: none;
            color: var(--text);
            border-radius: 12px;
            transition: border-color .15s, transform .15s;
        }
        .card:hover {
            border-color: var(--cyan);
            transform: translateY(-4px);
        }
        .card svg {
            width: 48px;
            height: 48px;
            color: var(--cyan);
        }
        .card h2 {
            font-size: 20px;
            font-weight: 640;
        }
        .card p {
            color: var(--muted);
            text-align: center;
            font-size: 14px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <h1>CardVault</h1>
    <div class="apps">
        <a class="card" href="products/">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <path d="m8 14 2.5-2.5L14 15l2-2 3 3"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
            </svg>
            <h2>Productos</h2>
            <p>Catálogo de productos con imágenes, precios y gestión</p>
        </a>
        <a class="card" href="inventory/">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
                <line x1="12" y1="22.08" x2="12" y2="12"/>
            </svg>
            <h2>Inventario</h2>
            <p>Control de inventario, entradas, salidas y stock</p>
        </a>
    </div>
</body>
</html>
