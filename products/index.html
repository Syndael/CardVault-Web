<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CardVault productos</title>
    <link rel="stylesheet" href="../static/css/product_catalog.css">
</head>
<body>
    <main class="app-shell">
        <header class="topbar">
            <div>
                <h1>Productos</h1>
                <p id="resultSummary">Cargando catalogo</p>
                <div id="authPanel"></div>
            </div>
            <form class="search" id="searchForm">
                <label for="searchInput">Buscar</label>
                <div class="search-row">
                    <input
                        id="searchInput"
                        name="q"
                        type="search"
                        autocomplete="off"
                        placeholder="Codigo, coleccion o producto"
                    >
                    <button type="submit" aria-label="Buscar">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="m21 21-4.3-4.3"></path>
                            <circle cx="11" cy="11" r="7"></circle>
                        </svg>
                    </button>
                </div>
            </form>
        </header>

        <section class="toolbar" aria-label="Controles de catalogo">
            <div class="density-note">
                <span id="layoutSummary">Ajustando tarjetas</span>
            </div>
            <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
                <label class="filter-check">
                    Manual
                    <select id="filterManual">
                        <option value="">Todos</option>
                        <option value="1">Sí</option>
                        <option value="0">No</option>
                    </select>
                </label>
                <label class="filter-check">
                    Verificado
                    <select id="filterVerified">
                        <option value="">Todos</option>
                        <option value="1">Sí</option>
                        <option value="0">No</option>
                    </select>
                </label>
                <span class="scroll-note" id="scrollStatus">Scroll para cargar mas</span>
                <button id="addProductBtn" class="btn-primary">+ Nuevo producto</button>
            </div>
        </section>

        <section class="catalog-wrap" aria-live="polite">
            <div class="product-grid" id="productGrid"></div>
            <div class="empty-state" id="emptyState" hidden>No hay productos para esta consulta.</div>
            <div class="load-sentinel" id="loadSentinel" aria-hidden="true"></div>
        </section>
    </main>

    <!-- Modal for product actions -->
    <div id="productModal" class="modal" hidden>
        <div class="modal-backdrop" id="modalBackdrop"></div>
        <div class="modal-body" role="dialog" aria-modal="true">
            <h2 id="modalTitle">Acciones producto</h2>
            <div id="modalDetail"></div>
            <form id="productForm">
                <input type="hidden" id="modalProductId">
                <div class="field-inline">
                    <div class="field" style="flex:1">
                        <label for="imageUrl">URL imagen</label>
                        <input id="imageUrl" type="url" placeholder="https://.../image.jpg">
                    </div>
                    <div class="field" style="flex:0 0 auto; min-width:140px">
                        <label for="imageLanguage">Idioma</label>
                        <select id="imageLanguage">
                            <option value="">(sin idioma)</option>
                        </select>
                    </div>
                </div>
                <div class="field">
                    <label for="priceUrl">URL precio / tracking</label>
                    <input id="priceUrl" type="url" placeholder="https://...">
                </div>
                <div class="actions">
                    <button type="submit">Guardar</button>
                    <button type="button" id="modalCancel">Cancelar</button>
                </div>
            </form>
    </div>
    </div>

    <!-- Create product modal -->
    <div id="createProductModal" class="modal" hidden>
        <div class="modal-backdrop" id="createBackdrop"></div>
        <div class="modal-body" role="dialog" aria-modal="true">
            <h2>Nuevo producto</h2>
            <form id="createProductForm">
                <div class="field">
                    <label for="newColCode">Codigo de coleccion</label>
                    <input id="newColCode" type="text" placeholder="swsh12, base1, ..." required>
                    <div id="colSuggestions" class="suggestions" style="display:none"></div>
                </div>
                <div id="newColFields">
                    <div class="field">
                        <label for="newColName">Nombre de coleccion (si no existe)</label>
                        <input id="newColName" type="text" placeholder="Sword & Shield...">
                    </div>
                    <div class="field">
                        <label for="newColLang">Idioma del nombre</label>
                        <select id="newColLang">
                            <option value="">Seleccionar...</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="newCardType">Tipo de carta</label>
                        <select id="newCardType">
                            <option value="">Seleccionar...</option>
                        </select>
                    </div>
                </div>
                <div class="field">
                    <label for="newProductNumber">Numero de producto</label>
                    <input id="newProductNumber" type="text" placeholder="001">
                </div>
                <div class="field">
                    <label class="checkbox-label">
                        <input id="newForceDownload" type="checkbox">
                        Force download
                    </label>
                </div>
                <div class="actions">
                    <button type="submit">Crear producto</button>
                    <button type="button" id="createCancel">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Login modal -->
    <div id="loginModal" class="modal" hidden>
        <div class="modal-backdrop" id="loginBackdrop"></div>
        <div class="modal-body" role="dialog" aria-modal="true">
            <h2>Iniciar sesión</h2>
            <form id="loginForm">
                <div class="field">
                    <label for="loginUsername">Usuario o email</label>
                    <input id="loginUsername" name="username" type="text" autocomplete="username">
                </div>
                <div class="field">
                    <label for="loginPassword">Contraseña</label>
                    <input id="loginPassword" name="password" type="password" autocomplete="current-password">
                </div>
                <div class="actions">
                    <button type="submit">Entrar</button>
                    <button type="button" id="loginCancel">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../static/js/product_catalog.js"></script>
</body>
</html>
